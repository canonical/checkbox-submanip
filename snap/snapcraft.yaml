title: Checkbox Submission Editor
license: GPL-3.0+
issues: https://github.com/canonical/checkbox-submanip/issues
website: https://github.com/canonical/checkbox-submanip/
source-code: https://github.com/canonical/checkbox-submanip/
contact: https://github.com/canonical/checkbox-submanip/issues

name: checkbox-submanip
base: core24
version: "1.0"
summary: Checkbox submission editor
description: |
  checkbox-submanip is the snap version of the Checkbox submission editor originally hosted on launchpad. 
  It lets you modify test results and comments in a Checkbox submission archive, 
  and saves the result as a new submission archive. The snap runs Submanip as a Flask
  web server at http://localhost:3001 by default. The port can be
  changed with `sudo snap set checkbox-submanip port=<port>`, which
  automatically restarts the web server on the new port.

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

package-repositories:
  - type: apt
    ppa: checkbox-dev/edge

# used by checkbox-ng
# we are not actually launching sessions, so just put it in tmp
layout:
  /var/tmp/checkbox-ng:
    bind: $SNAP_COMMON/checkbox-ng

apps:
  submanip:
    command: bin/python3 $SNAP/submanip/app.py
    daemon: simple
    restart-condition: on-failure
    plugs:
      - network-bind

  merge-reports:
    command: usr/bin/checkbox-cli merge-reports
    plugs:
      - home
      - removable-media

parts:
  submanip-source:
    plugin: dump
    source: .
    organize:
      app.py: submanip/app.py
      submission_utils.py: submanip/submission_utils.py
      static: submanip/static
      templates: submanip/templates
    prime:
      - submanip/*

  submanip-deps:
    plugin: nil
    stage-packages:
      - checkbox-ng
      - python3-checkbox-ng
    override-build: | # shell
      craftctl default
      # replace the stock checkbox.html exporter template with our own
      cp "$CRAFT_PROJECT_DIR/noautoescape-single-page.html" \
        "$CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/plainbox/impl/providers/exporters/data/checkbox.html"
      cp "$CRAFT_PROJECT_DIR/noautoescape-multi-page.html" \
        "$CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/plainbox/impl/providers/exporters/data/multi-page.html"

  submanip-venv:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    after:
      - submanip-deps
    override-build: | # shell
      craftctl default
      # the following is written by copilot 

      # checkbox-ng/plainbox and their apt-only Python dependencies (jinja2,
      # urwid, tqdm, xlsxwriter, etc.) come from the PPA deb, staged by
      # submanip-deps and installed at runtime under $SNAP/usr/lib/python3/
      # dist-packages, not from PyPI, so uv's own dependency resolution
      # never installs them into the venv it builds here. Since the venv is
      # otherwise isolated from that apt site-packages directory, add a
      # .pth file so the venv's site machinery puts it on sys.path at
      # interpreter startup. $SNAP only exists at runtime (not at build
      # time), so the .pth uses an "import ..." line to resolve it then,
      # rather than a plain path resolved now.
      site_packages="$(echo "$CRAFT_PART_INSTALL"/lib/python3.*/site-packages)"
      echo 'import os, sys; sys.path.append(os.path.join(os.environ["SNAP"], "usr/lib/python3/dist-packages"))' > "$site_packages/checkbox-ng.pth"
